name: Build daily slate

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 9am ET, before first pitch
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull today's games and odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python ingest.py

      - name: Run the model
        run: python build.py

      - name: Publish
        run: |
          git config user.name "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          git add index.html slate.json
          git diff --staged --quiet || git commit -m "slate $(date -u +%Y-%m-%d)"
          git push

